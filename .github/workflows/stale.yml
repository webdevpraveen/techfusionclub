name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has been inactive for 30 days. Please comment if it is still relevant, otherwise it will be closed in 7 days."
          stale-pr-message: "This pull request has been inactive for 30 days. We are marking it as stale. If you plan to continue working on this, please leave a comment. Otherwise, it will be closed in 7 days."
          close-issue-message: "This issue was closed because it has been inactive for 37 days."
          close-pr-message: "This PR was closed because it has been inactive for 37 days."
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "dependencies"
